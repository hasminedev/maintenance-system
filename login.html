<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Socadel - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="brand">
            <h1>SOCA<span>DEL</span></h1>
            <p>IT Equipment Maintenance System</p>
        </div>
        <p id="msg" class="msg"></p>
        <form method="POST" action="login.php">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p class="link">No account? <a href="register.html">Create one</a></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const msg = document.getElementById("msg");
        if (params.get("error") === "domain") {
            msg.textContent = "Only @camlight.cm email addresses are allowed.";
        } else if (params.get("error")) {
            msg.textContent = "Invalid email or password.";
        
        }
        if (params.get("registered")) {
            msg.style.color = "#6b8e00";
            msg.textContent = "Account created. You can now log in.";
        }
    </script>
</body>
</html>
